[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # VITE_* values are embedded in the client bundle; repo/docs also use placeholders
  # like "demo" and .firebaserc holds the Firebase project id — not leaked server secrets.
  SECRETS_SCAN_OMIT_KEYS = "VITE_PAYMENT_GATEWAY,GOOGLE_APPLICATION_CREDENTIALS,VITE_FIREBASE_PROJECT_ID,FIREBASE_PROJECT_ID,PAYMONGO_SECRET_KEY,PAYMONGO_WEBHOOK_SECRET,FIREBASE_SERVICE_ACCOUNT_JSON,VITE_EMAILJS_SERVICE_ID,VITE_EMAILJS_TEMPLATE_ID,VITE_EMAILJS_PUBLIC_KEY"
  SECRETS_SCAN_OMIT_PATHS = ".env.example,.firebaserc,README.md,docs/**,scripts/**"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
